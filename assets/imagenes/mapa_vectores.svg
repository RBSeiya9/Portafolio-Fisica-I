<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2542"/>
      <stop offset="100%" stop-color="#17365D"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Encabezado -->
  <text x="40" y="50" font-family="'Outfit', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">ESQUEMA CONCEPTUAL: ÁLGEBRA VECTORIAL EN 2D</text>
  <text x="40" y="75" font-family="'Inter', sans-serif" font-size="13" fill="#94A3B8">Descomposición Rectangular en Componentes Cartesianas y Teorema de Pitágoras</text>

  <!-- Sistema de Coordenadas -->
  <g transform="translate(100, 390)">
    <!-- Ejes coordenados -->
    <line x1="-30" y1="0" x2="350" y2="0" stroke="#64748B" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="0" y1="30" x2="0" y2="-280" stroke="#64748B" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="360" y="5" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">+X</text>
    <text x="-5" y="-290" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">+Y</text>

    <!-- Líneas punteadas de proyección -->
    <line x1="260" y1="0" x2="260" y2="-195" stroke="#94A3B8" stroke-dasharray="5,5" stroke-width="1.5"/>
    <line x1="0" y1="-195" x2="260" y2="-195" stroke="#94A3B8" stroke-dasharray="5,5" stroke-width="1.5"/>

    <!-- Componente Ax -->
    <line x1="0" y1="0" x2="255" y2="0" stroke="#10B981" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <text x="110" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#10B981">A_x = |A| cos(θ)</text>

    <!-- Componente Ay -->
    <line x1="0" y1="0" x2="0" y2="-190" stroke="#10B981" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <text x="-135" y="-95" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#10B981">A_y = |A| sin(θ)</text>

    <!-- Vector A resultante -->
    <line x1="0" y1="0" x2="255" y2="-190" stroke="#D97706" stroke-width="4.5" marker-end="url(#arrow)"/>
    <text x="140" y="-120" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#FBBF24">Vector A</text>

    <!-- Arco de ángulo theta -->
    <path d="M 60 0 A 60 60 0 0 0 49 -36" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <text x="70" y="-15" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">θ</text>
  </g>

  <!-- Tarjetas de Resumen Conceptual a la derecha -->
  <g transform="translate(520, 110)">
    <rect width="240" height="95" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">MÓDULO DEL VECTOR</text>
    <text x="16" y="58" font-family="'Fira Code', monospace" font-size="14" fill="#FFFFFF">|A| = √(Ax² + Ay²)</text>
    <text x="16" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Magnitud escalar positiva</text>
  </g>

  <g transform="translate(520, 225)">
    <rect width="240" height="95" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" fill="#FBBF24">DIRECCIÓN POLAR</text>
    <text x="16" y="58" font-family="'Fira Code', monospace" font-size="14" fill="#FFFFFF">θ = arctan(Ay / Ax)</text>
    <text x="16" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">+180° si Ax &lt; 0 (Cuadrante II/III)</text>
  </g>

  <g transform="translate(520, 340)">
    <rect width="240" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" fill="#10B981">OPERACIONES VECTORIALES</text>
    <text x="16" y="54" font-family="'Fira Code', monospace" font-size="12" fill="#E2E8F0">A · B = AxBx + AyBy (Escalar)</text>
    <text x="16" y="74" font-family="'Fira Code', monospace" font-size="12" fill="#E2E8F0">A × B = (AxBy - AyBx)k̂ (Vector)</text>
    <text x="16" y="96" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Lenguaje base de la mecánica</text>
  </g>
</svg>
