<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#labBg)"/>

  <!-- Título -->
  <text x="40" y="45" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">MONTAJE EXPERIMENTAL: CAÍDA LIBRE Y FOTOPUERTAS</text>
  <text x="40" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Determinación de la Aceleración de la Gravedad 'g' con Temporizador Digital</text>

  <!-- Soporte vertical graduado -->
  <rect x="180" y="100" width="24" height="340" rx="4" fill="#64748B" stroke="#475569" stroke-width="2"/>
  <rect x="120" y="440" width="144" height="20" rx="6" fill="#334155"/>

  <!-- Marcas de escala en la columna -->
  <line x1="180" y1="140" x2="190" y2="140" stroke="#FFFFFF" stroke-width="2"/>
  <text x="210" y="145" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">0.0 m (Electroimán)</text>

  <line x1="180" y1="210" x2="190" y2="210" stroke="#FFFFFF" stroke-width="2"/>
  <text x="210" y="215" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">0.5 m</text>

  <line x1="180" y1="290" x2="190" y2="290" stroke="#FFFFFF" stroke-width="2"/>
  <text x="210" y="295" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">1.0 m</text>

  <line x1="180" y1="380" x2="190" y2="380" stroke="#FFFFFF" stroke-width="2"/>
  <text x="210" y="385" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">1.5 m</text>

  <!-- Electroimán superior -->
  <rect x="130" y="115" width="40" height="30" rx="4" fill="#D97706"/>
  <circle cx="150" cy="155" r="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <text x="75" y="160" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FBBF24">Esfera</text>

  <!-- Fotopuerta 1 -->
  <rect x="130" y="200" width="40" height="20" rx="3" fill="#38BDF8"/>
  <line x1="130" y1="210" x2="170" y2="210" stroke="#EF4444" stroke-dasharray="3,3" stroke-width="2"/>
  <text x="50" y="215" font-family="'Inter', sans-serif" font-size="11" fill="#38BDF8">Fotopuerta 1</text>

  <!-- Fotopuerta 2 -->
  <rect x="130" y="370" width="40" height="20" rx="3" fill="#38BDF8"/>
  <line x1="130" y1="380" x2="170" y2="380" stroke="#EF4444" stroke-dasharray="3,3" stroke-width="2"/>
  <text x="50" y="385" font-family="'Inter', sans-serif" font-size="11" fill="#38BDF8">Fotopuerta 2</text>

  <!-- Caja del Cronómetro Digital -->
  <g transform="translate(460, 140)">
    <rect width="280" height="150" rx="12" fill="#020617" stroke="#334155" stroke-width="2"/>
    <text x="20" y="35" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#94A3B8">CRONÓMETRO DIGITAL PASCO</text>

    <!-- Pantalla LCD -->
    <rect x="20" y="50" width="240" height="55" rx="6" fill="#14532D" stroke="#166534"/>
    <text x="40" y="90" font-family="'Fira Code', monospace" font-size="32" font-weight="bold" fill="#4ADE80">0.553 s</text>

    <text x="20" y="130" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Precisión: ± 0.001 s | Canal Δt</text>
  </g>

  <!-- Gráfica teórica reducida -->
  <g transform="translate(460, 315)">
    <rect width="280" height="135" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="16" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#FBBF24">MODELO CINEMÁTICO: h vs t²</text>
    <line x1="30" y1="110" x2="250" y2="110" stroke="#64748B" stroke-width="1.5"/>
    <line x1="30" y1="110" x2="30" y2="40" stroke="#64748B" stroke-width="1.5"/>
    <!-- Recta de regresión -->
    <line x1="30" y1="110" x2="220" y2="45" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Puntos de medición -->
    <circle cx="70" cy="97" r="3.5" fill="#F59E0B"/>
    <circle cx="120" cy="80" r="3.5" fill="#F59E0B"/>
    <circle cx="170" cy="62" r="3.5" fill="#F59E0B"/>
    <circle cx="215" cy="46" r="3.5" fill="#F59E0B"/>
    <text x="130" y="125" font-family="'Fira Code', monospace" font-size="11" fill="#4ADE80">Pendiente = ½ g</text>
  </g>
</svg>
