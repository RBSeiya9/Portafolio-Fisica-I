<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dclBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#dclBg)"/>

  <!-- Título -->
  <text x="40" y="45" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">EVIDENCIA TALLER: DIAGRAMA DE CUERPO LIBRE (DCL)</text>
  <text x="40" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Descomposición de fuerzas en plano inclinado con rozamiento dinámico (ejes rotados)</text>

  <!-- Plano inclinado base -->
  <polygon points="120,400 480,400 480,220" fill="#334155" stroke="#475569" stroke-width="2"/>
  <text x="170" y="390" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">θ = 30°</text>

  <!-- Bloque sobre la rampa (rotado 26.56° / 30°) -->
  <g transform="translate(300, 310) rotate(-26.56)">
    <!-- Bloque -->
    <rect x="-40" y="-35" width="80" height="70" rx="6" fill="#D97706" stroke="#FDE68A" stroke-width="2"/>
    <text x="-15" y="8" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">m</text>

    <!-- Normal (perpendicular hacia arriba) -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrCyan)"/>
    <text x="10" y="-100" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">N = mg cos(θ)</text>

    <!-- Fricción cinética (paralela hacia arriba en rampa) -->
    <line x1="0" y1="0" x2="110" y2="0" stroke="#EF4444" stroke-width="4" marker-end="url(#arrRed)"/>
    <text x="35" y="-12" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#EF4444">f_k = μ_k N</text>

    <!-- Componente peso paralela al plano (hacia abajo de la rampa) -->
    <line x1="0" y1="0" x2="-120" y2="0" stroke="#F59E0B" stroke-width="4" marker-end="url(#arrAmber)"/>
    <text x="-150" y="-12" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#F59E0B">W_x = mg sin(θ)</text>

    <!-- Peso vertical real no rotado (referencia) -->
    <g transform="rotate(26.56)">
      <line x1="0" y1="0" x2="0" y2="125" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrAmber)"/>
      <text x="12" y="90" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">W = mg</text>
    </g>
  </g>

  <!-- Panel Explicativo a la derecha -->
  <g transform="translate(530, 110)">
    <rect width="230" height="340" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="32" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">ECUACIONES DINÁMICAS</text>

    <text x="16" y="65" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#CBD5E1">Eje Y (Perpendicular):</text>
    <text x="16" y="85" font-family="'Fira Code', monospace" font-size="12" fill="#38BDF8">ΣFy = N - mg cosθ = 0</text>
    <text x="16" y="105" font-family="'Fira Code', monospace" font-size="12" fill="#94A3B8">⇒ N = mg cos(30°)</text>

    <line x1="16" y1="125" x2="214" y2="125" stroke="#334155"/>

    <text x="16" y="150" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#CBD5E1">Eje X (Paralelo):</text>
    <text x="16" y="170" font-family="'Fira Code', monospace" font-size="12" fill="#F59E0B">ΣFx = mg sinθ - fk = ma</text>
    <text x="16" y="195" font-family="'Fira Code', monospace" font-size="11" fill="#EF4444">fk = μk (mg cosθ)</text>

    <line x1="16" y1="215" x2="214" y2="215" stroke="#334155"/>

    <text x="16" y="240" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#10B981">Aceleración Neta:</text>
    <text x="16" y="265" font-family="'Fira Code', monospace" font-size="12" fill="#10B981">a = g(sinθ - μk cosθ)</text>
    <text x="16" y="300" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Independiente de la masa m</text>
  </g>
</svg>
